# Build the Docker image and push it to Docker Hub.
#
# Triggered automatically on every published GitHub Release.
# Also runs on pushes to main to keep the `edge` tag up to date.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  – your Docker Hub username
#   DOCKERHUB_TOKEN     – an access token from hub.docker.com
#                         (Account Settings → Security → New Access Token)
#
# Tags produced:
#   On release v1.2.3 →  <user>/hypercat:1.2.3
#                         <user>/hypercat:1.2          (major.minor)
#                         <user>/hypercat:latest
#   On push to main   →  <user>/hypercat:edge

name: Build and push Docker image

on:
  release:
    types: [published]

  push:
    branches: [main]

  # Allow manual re-runs from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Docker build context ───────────────────────────────────────────────
      # Enable QEMU for multi-platform builds (linux/amd64 + linux/arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Authenticate ───────────────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Generate image tags ────────────────────────────────────────────────
      # docker/metadata-action automatically derives tags from the event:
      #   release  → semver tags (1.2.3, 1.2, latest)
      #   main     → edge
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/hypercat
          tags: |
            # semver tags on releases
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # "latest" only on stable releases (no pre-release suffix)
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !contains(github.ref_name, '-') }}
            # "edge" on every push to main
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      # ── Build and push ─────────────────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          # Cache layers from the registry to speed up subsequent builds
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/hypercat:buildcache
          cache-to:   type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/hypercat:buildcache,mode=max
