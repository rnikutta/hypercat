
[project]
name = "hypercat"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Robert Nikutta", email = "robert.nikutta@gmail.com" },
    { name = "Enrique Lopez-Rodriguez" },
    { name = "Kohei Ichikawa" },
]
description = "Hypercube of clumpy AGN tori"
keywords = ["astronomy", "active galactic nuclei", "hypercubes", "extremely large telescopes", "morphology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "astropy",
    "urwid>=2.0.1",
    "h5py",
    "matplotlib",
    "ipython",
    "pandas",
]

[project.urls]
"Source Code" = "https://github.com/rnikutta/hypercat"

[project.scripts]
hypercatgui = "hypercatgui.hypercatgui:main"

# On a mac, install optional dependencies with `pip install '.[dev]'` (include the single quotes)
[project.optional-dependencies]
dev = [
    "asv[virtualenv]==0.6.5", # Used to compute performance benchmarks
    "jupyter",                # Clears output from Jupyter notebooks
    "pre-commit",             # Used to run checks before finalizing a git commit
    "pytest",
    "pytest-cov",             # Used to report total code coverage
    "pytest-mock",            # Used for mocking in tests
]

[build-system]
requires = [
    "setuptools>=62",       # Used to build and package the Python project
    "setuptools_scm>=6.2",  # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.dat", "*.csv", "*.json", "*.png"]

[tool.setuptools_scm]
write_to = "src/hypercat/_version.py"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.coverage.run]
omit = ["src/hypercat/_version.py"]
